name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate TPCH data
        run: python scripts/generate_tpch.py ci.duckdb 0.1

      - name: Build and test
        run: dbt build --profiles-dir ci --target ci
