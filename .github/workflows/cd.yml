name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate full-scale TPCH data
        run: python scripts/generate_tpch.py prod.duckdb 1

      - name: Build and test against prod
        run: dbt build --profiles-dir ci --target prod

      - name: Generate docs
        run: dbt docs generate --profiles-dir ci --target prod

      - name: Collect docs site
        run: |
          mkdir -p site
          cp target/index.html target/manifest.json target/catalog.json site/

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
