version: 2

models:
  - name: fct_order_lines
    description: "One row per order line. Revenue measures follow the TPCH definition: net revenue is extended price after discount."
    columns:
      - name: order_line_id
        description: "Surrogate key: order_id and line_number."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: part_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parts')
                field: part_id
      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_id
      - name: ordered_at
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']
      - name: net_revenue
        data_tests:
          - not_null

  - name: dim_customers
    description: "One row per customer, with nation and region."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_suppliers
    description: "One row per supplier, with nation and region."
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null

  - name: dim_parts
    description: "One row per part."
    columns:
      - name: part_id
        data_tests:
          - unique
          - not_null

  - name: dim_dates
    description: "One row per calendar day, 1990 to 2000."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
